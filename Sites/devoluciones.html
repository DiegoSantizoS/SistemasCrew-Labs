<section class="devoluciones-page">
  <h1>Mis préstamos</h1>
  <p class="intro-devoluciones">Consulta los equipos que tienes prestados y registra su devolución.</p>
  <div class="devoluciones-tabs" role="tablist" aria-label="Secciones de devoluciones">
    <button id="tabDevoluciones" type="button" role="tab" aria-controls="panelDevoluciones" aria-selected="true">Devoluciones</button>
    <button id="tabMultas" type="button" role="tab" aria-controls="panelMultas" aria-selected="false" hidden>Devoluciones con multas</button>
  </div>
  <p id="avisoDevoluciones" role="status" aria-live="polite">Cargando tus préstamos…</p>
  <section id="panelDevoluciones" role="tabpanel" aria-labelledby="tabDevoluciones">
    <h2 id="tituloListaDevoluciones">Mis préstamos</h2>
    <section id="listaDevoluciones" aria-label="Mis equipos prestados"></section>
  </section>
  <section id="panelMultas" role="tabpanel" aria-labelledby="tabMultas" hidden>
    <h2>Préstamos vencidos con multa</h2>
    <p class="intro-devoluciones">La multa se calcula según la tarifa activa de la categoría y los días de retraso; se aplica al registrar la devolución.</p>
    <div id="listaVencidos"></div>
  </section>

  <dialog id="modalDevolucion" aria-labelledby="tituloDevolucion">
    <h2 id="tituloDevolucion">Registrar devolución</h2>
    <p id="equipoDevolucion"></p>
    <p id="resumenMulta" class="resumen-multa" hidden></p>
    <form id="formDevolucion">
      <input type="hidden" name="detalle_id">
      <label for="estadoRetorno">Estado en que devuelves el equipo</label>
      <select id="estadoRetorno" name="estado_retorno" required>
        <option value="">Selecciona el estado</option>
        <option value="disponible">En buen estado (Disponible)</option>
        <option value="reparacion">Necesita reparación</option>
      </select>
      <label for="observacionDevolucion">Observaciones (opcional)</label>
      <textarea id="observacionDevolucion" name="observaciones" rows="4" maxlength="255" placeholder="Describe daños o detalles de la devolución"></textarea>
      <div class="acciones-devolucion">
        <button type="submit">Confirmar devolución</button>
        <button type="button" id="cancelarDevolucion">Cancelar</button>
      </div>
    </form>
  </dialog>
</section>
