<header class="encabezado-modulo">
    <h1>Inventario</h1>
    <button id="IngresarEquipo" type="button">Ingresar equipo</button>
</header>

<dialog class="Formulario" id="ModalEquipos">
  <button id="cerrarModal">Cerrar</button>
  <form method="dialog" action="http://localhost/SistemasCrew-Labs/api/admin/Equipos.php" id="equipoForm">
    <input type="hidden" id="id_equipo" name="id_equipo">
    <label for="categoria">Categoria:</label>
    <select id="categoria" name="categoria" required> 
      <option value="">Seleccione una categoria</option>
    </select>

    <label for="codigo" id="etiquetaCodigoEquipo">Sufijo del código del equipo</label>
    <div class="campo-codigo-equipo">
      <span id="prefijoCodigoEquipo" aria-live="polite">EQ-</span>
      <input type="text" id="codigo" name="codigo" aria-describedby="prefijoCodigoEquipo" disabled required />
    </div>

    <span class="campo-en-linea">
      <label for="ubicacion">Ubicación:</label>
      <select id="ubicacion" name="ubicacion" required>
        <option value="">Seleccione una ubicación</option>
      </select>
    </span>

    <span class="campo-en-linea">
      <label for="estado">Estado:</label>
      <select id="estado" name="estado" required>
        <option value="">Seleccione un estado</option>
      </select>
    </span>

    <label for="marca">Marca:</label>
    <input type="text" id="marca" name="marca" />

    <label for="modelo">Modelo:</label>
    <input type="text" id="modelo" name="modelo" />

    <span class="campo-en-linea">
      <label for="serie">Serie:</label>
      <input type="text" id="serie" name="serie" />
    </span>

    <div class="campo-descripcion">
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" name="descripcion" rows="6"></textarea>
    </div>

    <button type="submit">Agregar Equipo</button>
  </form>
</dialog>

<dialog id="ModalPreview">
  <button type="button" id="cerrarPreview">Cerrar</button>
  <h2>Detalles del equipo</h2>
  <div id="DetalleEquipo">
  </div>
</dialog>

<div id="inventarioContainer">
  <!-- Campo de búsqueda y mensaje accesible con el resultado de la consulta. -->
  <div class="buscador-inventario">
    <label for="buscarEquipo">Buscar equipos</label>
    <input type="search" id="buscarEquipo" maxlength="100" placeholder="Escribe un código o descripción" aria-controls="inventarioTable" />
    <p id="resultadoBusqueda" role="status" aria-live="polite"></p>
  </div>
  <div class="tabla-desplazable" role="region" aria-label="Inventario de equipos" tabindex="0">
      <table id="inventarioTable">
        <thead>
          <tr>
            <th>Codigo Equipo</th>
            <th>Descripción</th>
            <th>Categorias</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
  </div>
  <div id="Paginacion"></div>
  <div id="PaginacionBusqueda" hidden aria-label="Páginas de resultados de búsqueda"></div>
</div>
