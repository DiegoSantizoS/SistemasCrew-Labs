<section class="prestamos-page">
    <h1>Equipos disponibles</h1>
    <p class="intro">Selecciona un equipo para enviar una solicitud de préstamo.</p>
    <label class="busqueda-equipos" for="buscarEquipo">Buscar equipo por nombre</label>
    <input id="buscarEquipo" type="search" placeholder="Ejemplo: microscopio" autocomplete="off" />
    <p id="avisoPrestamos" role="status" aria-live="polite"></p>
    <section id="equiposDisponibles" aria-label="Lista de equipos disponibles"></section>
  <dialog id="modalPrestamo" aria-labelledby="tituloFormulario">
    <h2 id="tituloFormulario">Solicitar préstamo</h2>
    <p id="equipoSeleccionado"></p>
    <form id="formPrestamo">
      <input type="hidden" name="equipo_id" />
      <div id="selectorUsuarioPrestamo" hidden>
        <label for="usuarioPrestamo">Asignar préstamo al usuario</label>
        <select id="usuarioPrestamo" name="usuario_id" disabled>
          <option value="">Selecciona un usuario activo</option>
        </select>
      </div>
      <label for="fechaVencimiento">Fecha prevista de devolución</label>
      <input id="fechaVencimiento" type="date" name="fecha_vencimiento" required />
      <label for="motivoPrestamo">Motivo del préstamo</label>
      <textarea id="motivoPrestamo" name="motivo" rows="4" maxlength="500" placeholder="Describe para qué necesitas el equipo"></textarea>
      <div class="acciones">
        <button type="submit">Enviar solicitud</button>
        <button type="button" id="cerrarPrestamo">Cancelar</button>
      </div>
    </form>
  </dialog>
</section>
